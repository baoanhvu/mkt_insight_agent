# =============================================================================
# secrets.example.yaml - MAU. File nay CO commit.
# =============================================================================
# Cach dung:
#   cp config/secrets.example.yaml config/secrets.yaml
#   -> dien gia tri that vao config/secrets.yaml
#
# QUY TAC (xem docs/10-config-secrets.md muc 10.5):
#   1. Repo phai de PRIVATE. Toan bo thiet ke gia dinh nhu vay.
#   2. DUY NHAT mot file chua bi mat: config/secrets.yaml
#   3. DUY NHAT mot lop doc bi mat: app/settings.py
#   4. Agent dung role CHI DOC -> lo ket noi cung khong sua/xoa duoc du lieu
#   5. Doi TOAN BO key va xoa instance vDB ngay sau hackathon
#
# Khi chuyen sang che do an toan, chi can dat bien:
#   MKT_SECRETS_BACKEND=env                 -> doc tu bien moi truong
#   MKT_SECRETS_BACKEND=agentbase_identity  -> lay qua Access Control cua AgentBase
# =============================================================================

database:
  # Role CHI DOC - agent dung cai nay cho MOI truy van phuc vu cau tra loi.
  # Role nay co default_transaction_read_only = on o muc DB.
  url: "postgresql+psycopg://mkt_agent_ro:CHANGEME@<rds-host>:5432/mkt_insight?sslmode=require"

  # Role chu so huu - CHI dung trong script ETL, khong bao gio trong process web.
  url_admin: "postgresql+psycopg://mkt_owner:CHANGEME@<rds-host>:5432/mkt_insight?sslmode=require"

  # Role ghi telemetry - chi INSERT vao schema ops.
  url_trace: "postgresql+psycopg://mkt_trace_rw:CHANGEME@<rds-host>:5432/mkt_insight?sslmode=require"

llm:
  # API key MaaS. Phai o trang thai ACTIVE (key moi tao o trang thai CREATING).
  # Tao bang: ./.claude/skills/agentbase/scripts/aip.sh api-keys create --name mkt-insight-poc
  api_key: "CHANGEME"

  # Dung cho profile local khi chay Ollama. Ollama khong kiem tra key.
  api_key_local: "ollama"

greennode:
  # KHONG can khi chay tren AgentBase Runtime - nen tang tu tiem bon bien:
  #   GREENNODE_CLIENT_ID, GREENNODE_CLIENT_SECRET,
  #   GREENNODE_AGENT_IDENTITY, GREENNODE_ENDPOINT_URL
  # Chi can khi chay script deploy tu may dev.
  client_id: "CHANGEME"
  client_secret: "CHANGEME"

  # Chi can neu dung vStorage de xuat file (Phase 2, xem docs/03 muc 3.6)
  vstorage:
    endpoint_url: "https://hcm04.vstorage.vngcloud.vn"
    region: "HCM04"
    access_key: "CHANGEME"
    secret_key: "CHANGEME"
    bucket: "mkt-insight-exports"

admin:
  # Bao ve /api/admin/*. Khong co token -> tra 404 (khong phai 401).
  token: "CHANGEME"
