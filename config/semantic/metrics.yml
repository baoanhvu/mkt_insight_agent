# =============================================================================
# metrics.yml - Catalog chi so
# =============================================================================
# LLM KHONG VIET SQL. No chon chi so tu file nay va phat ra mot MetricRequest.
# Compiler (app/semantic/compiler.py) sinh SQL tham so hoa tu day.
# Xem docs/05-semantic-layer.md.
#
# CACH DOC MOT KHAI BAO CHI SO
#   sql               bieu thuc TONG HOP, khong phai cau SELECT day du.
#                     Compiler boc no vao SELECT ... FROM <dataset.table> GROUP BY ...
#   unit              count | vnd | ratio | percent | days | rate_pct_month | text
#   format            dinh dang hien thi; xem app/web/formatting.py
#   higher_is_better  dung de to mau va de lop L5 bat loi "doc nguoc dau"
#   min_sample_size   n duoi nguong nay -> tra INSUFFICIENT_SAMPLE, KHONG tra so
#   caveat_vi         BAT BUOC xuat hien trong cau tra loi; lop L3 kiem tra
#   reference         gia tri da kiem chung -> tests/test_metrics_contract.py
#
# QUY TAC SUA
#   1. Doi `sql` -> phai cap nhat `reference` va chay test_metrics_contract.py
#   2. Tang `version` moi lan doi -> ghi vao ops.agent_trace.metrics_version
#   3. KHONG BAO GIO dua cong thuc chi so vao prompt. Prompt dieu khien ngon ngu,
#      file nay dieu khien su that.
#
# TAT CA gia tri trong `reference` da duoc kiem chung ngay 2026-09-19 bang cach
# chay chinh cac bieu thuc SQL nay tren du lieu that.
# =============================================================================

version: "1.0.0"
validated_at: "2026-09-19"
validated_against: "data/full_schema_mock_v2.xlsx"

# Lat cat mac dinh dung cho moi gia tri trong khoi `reference`
reference_slice:
  date_from: "2026-08-01"
  date_to: "2026-09-01"     # exclusive

# =============================================================================
# CAC KHOI YAML DUNG LAI  (YAML anchors)
# =============================================================================
_anchors:
  default_app_dims: &default_app_dims
    [campaign_id, campaign_name, channel, sub_channel, partner_code, product_id,
     application_status, income_band, age_band, occupation, has_app, device_os,
     device_price_segment, geo_location_match, reason_level_1, reason_level_2,
     create_date, is_repeat_loan]

  lead_funnel_caveat: &lead_funnel_caveat >
    Ty le tong hop muc chien dich, KHONG phai attribution tung lead: bang ho so vay
    khong co khoa noi ve bang lead (xem docs/02-data-model.md muc 2.1).

  has_app_correlation_caveat: &has_app_correlation_caveat >
    Khac biet giua nhom co app va khong co app la TUONG QUAN, chua chung minh nhan qua.


metrics:

# =============================================================================
# NHOM 1 - DEM VA PHEU  (dataset: application)
# =============================================================================

  applications:
    label_vi: "Số hồ sơ"
    description_vi: >
      Dem ho so vay duoc tao trong ky, GOM CA ho so sau do bi tu choi.
    dataset: application
    sql: "COUNT(*)"
    unit: count
    format: "#,##0"
    higher_is_better: null
    allowed_dimensions: [campaign_id, campaign_name, channel, sub_channel, partner_code,
                         product_id, application_status, income_band, age_band, occupation,
                         has_app, device_os, device_price_segment, geo_location_match,
                         reason_level_1, reason_level_2, create_date, is_repeat_loan]
    reference:
      total: 2687
      by_campaign: {CMP-FB-001: 525, CMP-GG-001: 478, CMP-TT-001: 489,
                    CMP-ZL-RL1: 486, CMP-PTN-MOMO: 375, CMP-PTN-BRK01: 334}

  disbursed_loans:
    label_vi: "Số khoản giải ngân"
    description_vi: >
      Ho so co disbursement_date khac NULL. Khong giao voi tap ho so bi tu choi.
    dataset: application
    sql: "COUNT(*) FILTER (WHERE is_disbursed)"
    unit: count
    format: "#,##0"
    higher_is_better: true
    allowed_dimensions: *default_app_dims
    reference:
      total: 1625
      by_campaign: {CMP-FB-001: 306, CMP-GG-001: 282, CMP-TT-001: 218,
                    CMP-ZL-RL1: 447, CMP-PTN-MOMO: 209, CMP-PTN-BRK01: 163}

  rejected_loans:
    label_vi: "Số hồ sơ bị từ chối"
    dataset: application
    sql: "COUNT(*) FILTER (WHERE is_rejected)"
    unit: count
    format: "#,##0"
    higher_is_better: false
    reference:
      total: 1062
      by_reason_level_1: {"No xau CIC": 364, "Thu nhap khong du dieu kien": 327,
                          "Ho so khong hop le": 215, "Nghi ngo gian lan": 156}

  approval_rate:
    label_vi: "Tỷ lệ duyệt"
    description_vi: >
      So khoan giai ngan chia cho tong so ho so, trong cung ky va cung lat cat.
      Mau so GOM ca ho so bi tu choi - do la chu dich.
    dataset: application
    sql: |
      CASE WHEN COUNT(*) = 0 THEN NULL
           ELSE COUNT(*) FILTER (WHERE is_disbursed)::numeric / COUNT(*) END
    unit: ratio
    format: "0.0%"
    higher_is_better: true
    min_sample_size: 30
    thresholds:
      critical: {lt: 0.45}
      warning:  {lt: 0.55}
      good:     {gte: 0.70}
    reference:
      total: 0.604764
      by_campaign: {CMP-FB-001: 0.583, CMP-GG-001: 0.590, CMP-TT-001: 0.446,
                    CMP-ZL-RL1: 0.920, CMP-PTN-MOMO: 0.557, CMP-PTN-BRK01: 0.488}

  rejection_rate:
    label_vi: "Tỷ lệ từ chối"
    dataset: application
    sql: |
      CASE WHEN COUNT(*) = 0 THEN NULL
           ELSE COUNT(*) FILTER (WHERE is_rejected)::numeric / COUNT(*) END
    unit: ratio
    format: "0.0%"
    higher_is_better: false
    min_sample_size: 30
    reference:
      total: 0.395236
      by_geo_location_match: {"false": 0.456, "true": 0.391}
      by_device_os: {Windows: 0.492, Android: 0.391, iOS: 0.389}

  leads:
    label_vi: "Số lead"
    description_vi: "Dem lead marketing sinh ra trong ky."
    dataset: campaign_daily
    sql: "SUM(leads)"
    unit: count
    format: "#,##0"
    allowed_dimensions: [campaign_id, activity_date]
    reference:
      total: 14530
      by_campaign: {CMP-FB-001: 3454, CMP-GG-001: 2287, CMP-TT-001: 4280,
                    CMP-ZL-RL1: 1414, CMP-PTN-MOMO: 1978, CMP-PTN-BRK01: 1117}

  lead_to_application_rate:
    label_vi: "Tỷ lệ lead thành hồ sơ"
    dataset: campaign_daily
    sql: |
      CASE WHEN SUM(leads) = 0 THEN NULL
           ELSE SUM(applications)::numeric / SUM(leads) END
    unit: ratio
    format: "0.0%"
    higher_is_better: true
    min_sample_size: 100
    allowed_dimensions: [campaign_id, activity_date]
    caveat_vi: >
      Ty le tong hop muc chien dich, KHONG phai attribution tung lead: bang ho so
      vay khong co khoa noi ve bang lead (xem docs/02-data-model.md muc 2.1).
      Lead va ho so duoc dem doc lap roi chia cho nhau trong cung ky.
    reference:
      total: 0.184928
      by_campaign: {CMP-FB-001: 0.152, CMP-GG-001: 0.209, CMP-TT-001: 0.114,
                    CMP-ZL-RL1: 0.344, CMP-PTN-MOMO: 0.190, CMP-PTN-BRK01: 0.299}

  lead_to_disbursed_rate:
    label_vi: "Tỷ lệ lead thành khoản giải ngân"
    dataset: campaign_daily
    sql: |
      CASE WHEN SUM(leads) = 0 THEN NULL
           ELSE SUM(disbursed)::numeric / SUM(leads) END
    unit: ratio
    format: "0.0%"
    higher_is_better: true
    min_sample_size: 100
    allowed_dimensions: [campaign_id, activity_date]
    caveat_vi: *lead_funnel_caveat
    reference:
      total: 0.111838

# =============================================================================
# NHOM 2 - QUY MO CHO VAY  (dataset: application)
# =============================================================================

  total_loan_amount:
    label_vi: "Tổng dư nợ giải ngân"
    dataset: application
    sql: "SUM(loan_amount)"
    unit: vnd
    format: "#,##0"
    higher_is_better: true
    description_vi: >
      loan_amount la NULL o 1 062 ho so bi tu choi nen SUM tu dong bo qua chung.
    reference:
      total: 59815781194
      by_campaign_approx: {CMP-ZL-RL1: 24441080000, CMP-FB-001: 8995387000}

  avg_loan_amount:
    label_vi: "Khoản vay trung bình"
    description_vi: >
      MAU SO chi gom ho so DA GIAI NGAN, vi loan_amount la NULL o ho so bi tu choi.
      Day khong phai loi - do la dinh nghia. Dung SUM(loan_amount)/COUNT(*) se sai 39%.
    dataset: application
    sql: "AVG(loan_amount)"
    unit: vnd
    format: "#,##0"
    higher_is_better: true
    min_sample_size: 30
    reference:
      by_campaign: {CMP-ZL-RL1: 54678040, CMP-GG-001: 30985293, CMP-FB-001: 29396690,
                    CMP-TT-001: 30498347, CMP-PTN-MOMO: 30431978, CMP-PTN-BRK01: 28420459}
      by_is_repeat_loan: {"true": 54678040, "false": 30029455}

  avg_interest_rate:
    label_vi: "Lãi suất danh nghĩa trung bình"
    dataset: application
    sql: "AVG(nominal_interest_rate)"
    unit: rate_pct_month
    format: "0.00"
    reference:
      range: [1.50, 2.60]
      by_campaign_approx: {CMP-ZL-RL1: 2.05, CMP-FB-001: 2.06, CMP-GG-001: 2.03}

  avg_tenure:
    label_vi: "Kỳ hạn trung bình"
    dataset: application
    sql: "AVG(tenure)"
    unit: months
    format: "0.0"
    reference:
      by_campaign_approx: {CMP-ZL-RL1: 7.8, CMP-TT-001: 5.6, CMP-FB-001: 6.3}

  repeat_loan_share:
    label_vi: "Tỷ trọng khoản vay lại"
    dataset: application
    sql: |
      CASE WHEN COUNT(*) = 0 THEN NULL
           ELSE COUNT(*) FILTER (WHERE is_repeat_loan)::numeric / COUNT(*) END
    unit: ratio
    min_sample_size: 30
    format: "0.0%"
    reference:
      total: 0.1809     # 486 / 2687

# =============================================================================
