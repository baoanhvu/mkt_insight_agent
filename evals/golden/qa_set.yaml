# =============================================================================
# qa_set.yaml - Golden set 100 ca
# =============================================================================
# Day la DINH NGHIA CUA "DUNG". Khong co file nay thi khong do duoc gi, va
# khong hieu chinh duoc nguong chan.
#
# LUOC DO MOT CA
#   id                     G001..G100
#   question               cau hoi nguoi dung go
#   category               aggregate|ranking|diagnosis|funnel|persona|clv|risk|
#                          adversarial|unanswerable|ambiguous|empty_result|export
#   difficulty             easy | medium | hard
#   split                  dev | test
#   expected_behavior      answer | clarify | refuse
#   expected_intent        intent ma router phai tra ve
#   gold_sql               truy van doi chung (tuy chon, de do execution accuracy)
#   must_mention_numbers   so BAT BUOC xuat hien trong cau tra loi (dang hien thi vi-VN)
#   must_mention_entities  ten BAT BUOC xuat hien
#   must_mention_phrases   cum tu BAT BUOC xuat hien
#   must_not_mention_*     bay: xuat hien la FAIL
#   expected_stats_flag    ky vong ve ket qua kiem dinh
#   notes                  vi sao ca nay ton tai
#
# THANH PHAN (xem docs/13-testing-eval.md muc 13.4)
#   20 easy + 20 medium + 20 hard = 60 tra loi duoc
#   12 adversarial | 12 unanswerable | 8 ambiguous | 5 empty_result | 3 export
#
# 32/100 ca thuoc nhom bay/khong tra loi duoc/mo ho. Ty le cao la CO CHU DICH:
# do la nhung ca phan biet duoc agent tot voi agent kem. Ca de thi agent nao cung qua.
#
# MOI CON SO trong file nay da duoc kiem chung tren du lieu that ngay 2026-09-19.
# =============================================================================

