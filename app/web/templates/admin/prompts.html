{% extends "base.html" %}
{% block title %}Admin · Prompts{% endblock %}
{% block body %}
<div x-data="adminPrompts('{{ admin_token }}')" x-init="init()" class="max-w-6xl mx-auto p-4">
  <header class="flex items-center justify-between mb-4">
    <div class="font-semibold text-lg">{{ app_name }} · Quản trị prompt</div>
    <div class="text-xs text-slate-500">Sửa prompt có rào - xem docs/07-prompt-fewshot.md §7.5</div>
  </header>

  <div class="grid grid-cols-[260px_1fr] gap-4" style="height: 75vh;">
    <div class="border rounded-lg bg-white overflow-y-auto">
      <template x-for="p in prompts" :key="p.id">
        <button
          class="block w-full text-left px-3 py-2 text-sm border-b hover:bg-slate-50"
          :class="selected === p.id ? 'bg-slate-100 font-medium' : ''"
          @click="select(p.id)">
          <div x-text="p.id"></div>
          <div class="text-xs text-slate-400" x-text="p.version + ' · ' + p.model_role"></div>
        </button>
      </template>
      <p x-show="prompts.length === 0" x-cloak class="p-3 text-xs text-slate-400">
        Đang tải danh sách prompt...
      </p>
    </div>

    <div class="border rounded-lg bg-white p-3 flex flex-col gap-2">
      <template x-if="!selected">
        <p class="text-sm text-slate-400">Chọn một prompt bên trái để sửa.</p>
      </template>
      <template x-if="selected">
        <div class="flex flex-col gap-2 h-full">
          <div class="flex items-center justify-between">
            <div class="font-medium" x-text="selected + ' — v' + version"></div>
            <div class="flex gap-2">
              <button class="text-sm rounded-lg px-3 py-1.5 border" @click="validateOnly()">Kiểm tra</button>
              <button class="text-sm rounded-lg px-3 py-1.5 bg-slate-900 text-white" @click="save()">
                Lưu
              </button>
            </div>
          </div>
          <textarea x-model="content" spellcheck="false"
                    class="flex-1 font-mono text-xs border rounded-lg p-2 w-full"
                    style="min-height: 50vh;"></textarea>
          <div x-show="message" x-cloak class="text-xs rounded-lg p-2"
               :class="messageIsError ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'"
               x-text="message"></div>
        </div>
      </template>
    </div>
  </div>
</div>
<script src="/static/admin.js"></script>
{% endblock %}
