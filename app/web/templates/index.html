{% extends "base.html" %}
{% block body %}
<div x-data="dashboardApp()" x-init="init()">

  <header class="h-14 flex items-center justify-between px-4 border-b bg-white sticky top-0"
           style="top: env(safe-area-inset-top, 0px);">
    <div class="font-semibold">{{ app_name }}</div>
    <div class="text-xs text-slate-500 flex items-center gap-3">
      <span>Dữ liệu: 01–31/08/2026</span>
      <span x-show="!ready" class="text-amber-600" x-cloak>⚠ Hệ thống chưa sẵn sàng đầy đủ</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4">
    {% include "_dashboard.html" %}
    {% include "_persona.html" %}
    {% include "_actions.html" %}
    <div x-show="tab === 'chat'" x-cloak>
      {% include "_chat.html" %}
    </div>
  </main>

  <nav class="sticky bottom-0 bg-white border-t flex justify-center gap-1 p-2"
       style="bottom: env(safe-area-inset-bottom, 0px);">
    <template x-for="t in tabs" :key="t.id">
      <button class="px-3 py-1.5 rounded-lg text-sm"
              :class="tab === t.id ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'"
              @click="tab = t.id"
              x-text="t.label"></button>
    </template>
  </nav>

  {% include "_evidence_panel.html" %}
</div>
{% endblock %}
