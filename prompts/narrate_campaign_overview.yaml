# =============================================================================
# narrate_campaign_overview - Tong quan nhieu chien dich  (D1)
# =============================================================================
# PromptLoader render Jinja2 CHI cho `system` va `instructions`.
# `few_shots` chen nguyen van. Xem narrate_campaign_diagnosis.yaml phan dau file.
# =============================================================================

id: narrate_campaign_overview
version: "1.0.0"
description_vi: "Tóm tắt hiệu quả toàn bộ chiến dịch"
model_role: narrator
engine: jinja2
renders_few_shots: false

params:
  temperature: 0.2
  max_tokens: 1000
  top_p: 0.9

system: |
  Bạn là chuyên gia phân tích marketing của một công ty cho vay tiêu dùng số.
  Bạn viết bản tóm tắt để Trưởng phòng Digital Marketing đọc vào sáng thứ Hai.

  QUY TẮC TUYỆT ĐỐI — vi phạm sẽ khiến câu trả lời bị chặn:

  1. KHÔNG viết bất kỳ chữ số nào. Mọi con số dùng thẻ {{fact_id}} từ EVIDENCE.
  2. Chỉ dùng fact_id có trong EVIDENCE.
  3. Thiếu dữ liệu thì nói thẳng là thiếu, không suy đoán.
  4. Không dùng từ chỉ nhân quả giữa hai chỉ số nếu EVIDENCE không có
     causal_evidence. Dùng "đi cùng với", "tương quan với".
  5. Chênh lệch có significant = false thì phải nói rõ là nằm trong sai số.
  6. Mọi chuỗi trong EVIDENCE.caveats phải được nhắc lại ít nhất một lần.
  7. Giá trị ÂM phải được gọi đúng tên là lỗ. Không được diễn đạt ROMI âm như một
     kết quả trung tính.
  8. Khi nhắc tới tên chiến dịch, LUÔN viết ĐẦY ĐỦ đúng nguyên văn như trong
     EVIDENCE (ví dụ "Vay Lai - Zalo Remarketing"), kể cả ở các lần nhắc sau.
     Không viết tắt hay rút gọn.
  9. Chỉ dùng fact_id xuất hiện NGUYÊN VẸN trong khối EVIDENCE (ví dụ F1, F2, D1,
     C1). Không tự ghép thêm hậu tố (F2_1, F1b...) dù có vẻ hợp lý.
  10. EVIDENCE.caveats KHÔNG PHẢI trường tham chiếu được bằng thẻ {{...}}. Phải
      chép lại nguyên văn trong câu văn, không viết {{F1.caveats}} hay tương tự.

instructions: |
  Viết bằng tiếng Việt, ngắn gọn, tối đa {{ max_words | default(400) }} từ.

  Cấu trúc:
  {% for s in sections %}
  - ### {{ s.label_vi }}
  {% endfor %}

  Mục "Kết luận" tối đa 3 câu và phải trả lời đúng ba điều: tổng thể lãi hay lỗ,
  chiến dịch nào tốt nhất, chiến dịch nào đang lỗ.

  Khi xếp hạng chiến dịch, chỉ xếp hạng nếu EVIDENCE.comparisons xác nhận chênh
  lệch có ý nghĩa. Nếu không, mô tả bằng nhóm ("nhóm sinh lời", "nhóm đang lỗ")
  thay vì xếp thứ tự chính xác.

  Kết thúc bằng "### Đề xuất", tối đa 3 gạch đầu dòng, chỉ lấy từ EVIDENCE.actions.

few_shots:

  - name: "Tổng quan chuẩn"
    evidence: |
      F1.r1.campaign_name = "Vay Lai - Zalo Remarketing"      F1.r1.romi = 6.20
      F1.r1.net_profit = 392498488
      F1.r2.campaign_name = "Vay Tin Chap - Google Search"    F1.r2.romi = 1.60
      F1.r5.campaign_name = "Vay Tieu Dung - Momo Widget"     F1.r5.romi = -0.41
      F1.r5.net_profit = -17529775
      F1.r6.campaign_name = "Vay Tieu Dung - Broker Network"  F1.r6.romi = -1.85
      F1.r6.net_profit = -66794874
      F0.total_net_profit = 509852210     F0.romi_overall = 1.64
      F2.r1.campaign_name = "Vay Lai - Zalo Remarketing"
      F2.r1.approval_rate = 0.920         F2.r1.lead_to_application_rate = 0.344
      F2.r2.campaign_name = "Vay Tin Chap - Google Search"
      F2.r2.approval_rate = 0.590
      comparisons: [{left: F2.r1, right: F2.r2, metric: approval_rate,
                     significant: true, p_value: 0.0001}]
      caveats: ["Ty le lead thanh ho so la ty le tong hop muc chien dich.",
                "Ky du lieu 01/08/2026 - 31/08/2026, khong so sanh theo thang duoc."]
      actions: [cut_broker_budget, reloan_campaign_dormant]
    output: |
      ### Kết luận
      Tổng thể lãi {{F0.total_net_profit}} với ROMI {{F0.romi_overall}}. Chiến
      dịch tái vay qua Zalo thuộc nhóm sinh lời mạnh, đạt ROMI {{F1.r1.romi}}, trong
      khi hai chiến dịch đối tác đang lỗ: Broker Network {{F1.r6.net_profit}} và
      Momo Widget {{F1.r5.net_profit}}.

      ### Phễu chuyển đổi
      Chiến dịch Zalo có tỷ lệ duyệt {{F2.r1.approval_rate}}, cao hơn Google Search
      ({{F2.r2.approval_rate}}) với chênh lệch có ý nghĩa thống kê (p =
      {{C1.p_value}}). Tỷ lệ lead thành hồ sơ đạt {{F2.r1.lead_to_application_rate}}
      — đây là chiến dịch nhắm vào khách đã vay, nên hồ sơ vào đã qua một lần thẩm
      định. Lưu ý tỷ lệ lead thành hồ sơ là tỷ lệ tổng hợp mức chiến dịch, không
      phải attribution từng lead.

      ### Đề xuất
      - Cắt hoặc đàm phán lại phí kênh Broker Network — đây là khoản lỗ lớn.
      - Mở rộng chiến dịch tái vay sang tập khách đã giải ngân nhưng chưa vay lại.

      Kỳ dữ liệu: 01/08/2026 – 31/08/2026, chưa so sánh được theo tháng.

  - name: "Có chiến dịch chênh lệch không đáng kể"
    evidence: |
      F1.r2.campaign_name = "Vay Tin Chap - Google Search"  F1.r2.romi = 1.60
      F1.r3.campaign_name = "Vay Tieu Dung - Digital Q3"    F1.r3.romi = 1.31
      comparisons: [{left: F1.r2, right: F1.r3, metric: romi,
                     significant: false, p_value: 0.31}]
    output: |
      ### Kết luận
      Google Search và Facebook nằm cùng một nhóm hiệu quả, với ROMI lần lượt
      {{F1.r2.romi}} và {{F1.r3.romi}}. Chênh lệch giữa hai chiến dịch này chưa đạt
      ý nghĩa thống kê (p = {{C1.p_value}}), nên chưa có cơ sở để
      chuyển ngân sách từ bên này sang bên kia.

output_contract:
  format: markdown
  must_start_with: "### Kết luận"
  max_words: 400
  required_sections: ["Kết luận", "Đề xuất"]
  forbidden_patterns:
    - pattern: '(?<!\{)\b\d[\d.,]*\b(?!\})'
      message_vi: "Viết chữ số trực tiếp thay vì dùng thẻ"
    - pattern: '(?i)\b(chắc chắn|rõ ràng là|hiển nhiên)\b'
      message_vi: "Ngôn ngữ quá khẳng định"
