# docker-compose.dev.yml -- CHI dung cho test/CI (APP_PROFILE=test).
#
# KHONG phai DB thu hai theo nghia nguon su that: day la mirror cuc bo, nap
# bang chinh etl/ tu cung file Excel, dung de unit test va golden set chay
# duoc khi mat mang hoac trong CI. local va greennode deu tro toi CUNG MOT
# vDB RDS tren GreenNode - xem docs/03-database-choice.md muc 3.5.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mkt_insight
      POSTGRES_USER: mkt_owner
      POSTGRES_PASSWORD: devonly
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkt_owner -d mkt_insight"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
